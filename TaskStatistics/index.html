<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h2>Список задач:</h2>
    <input class="add-task" type="text" placeholder="введите новую задачу">
    <select class="select" name="" id="">
        <option disabled selected value="">Приоритет</option>
        <option value="important">Важно</option>
        <option value="not-important">Не важно</option>
    </select>
    <button class="addbtn">Добавить</button><br><br>
    <input class="search-task" type="text" placeholder="Поиск задачи"><br><br>
    <button class="sort">Сортировать</button>
    <div class="tasks__result"></div>
    <div class="completed"></div>
    <div class="uncompleted"></div>
    
    <script src="./script.js"></script>
</body>
</html>
